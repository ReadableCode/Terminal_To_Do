[project]
name = "Terminal_To_Do"
version = "0.1.0"
description = "Terminal_To_Do"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=6.29.5",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
    "readable-utils[s3]",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.16.8",
]

[tool.ruff]
# One tool in place of flake8 + isort, and one config in place of .flake8,
# .isort.cfg and a [tool.flake8] block flake8 never read (it has no pyproject
# support).
line-length = 120

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, C90 mccabe, I import sorting: the union of what
# flake8 and isort were checking. E203 is whitespace-before-punctuation, which
# the formatter deliberately produces in slices.
select = ["E", "W", "F", "C90", "I"]
ignore = ["E203"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true

[tool.uv.sources]
readable-utils = { git = "https://github.com/ReadableCode/readable_utils.git", tag = "v0.2.0" }
